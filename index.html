<style>
:root {
    --green: #2f5d3a;
    --green-light: #3f7a4c;
    --dark: #162019;
    --dark-card: #202c23;
    --tan: #d8c5a5;
    --cream: #f7f4ed;
    --gold: #c99b52;
    --text: #f5f3ee;
    --muted: #b9c0b8;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--dark);
    color: var(--text);
    line-height: 1.6;
}

/* Header */
header {
    background: #101812;
    color: white;
    padding: 14px 5%;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
}

nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: white;
}

.logo span {
    color: var(--gold);
}

nav ul {
    display: flex;
    list-style: none;
    gap: 20px;
    padding: 0;
    margin: 0;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    color: var(--gold);
}

/* Hero Section */
.hero {
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 5%;

        linear-gradient(rgba(16,24,18,0.80), rgba(16,24,18,0.95)),
        linear-gradient(135deg, #2f5d3a, #162019);
}

.hero-content {
    max-width: 850px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 78px);
    margin-bottom: 15px;
    line-height: 1.1;
}

.hero h1 span {
    color: var(--gold);
}

.hero p {
    font-size: 20px;
    color: var(--muted);
    max-width: 700px;
    margin: 0 auto 30px;
}

.btn {
    display: inline-block;
    background: var(--gold);
    color: #152018;
    padding: 14px 25px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    margin: 5px;
    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-2px);
    background: #ddb16b;
}

.btn-outline {
    background: transparent;
    border: 2px solid var(--gold);
    color: var(--gold);
}

section {
    padding: 75px 5%;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 38px;

}

.section-title p {
    color: var(--muted);
}

.services {
    background: #1b261e;
}

.service-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

    max-width: 1200px;
    margin: auto;
}

.card {
    background: var(--dark-card);
    padding: 28px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: var(--gold);
}

.card h3 {
    color: var(--gold);
    margin-top: 0;
}

.card p {
    color: var(--muted);
}

.about {
    max-width: 1000px;
    margin: auto;
    text-align: center;
}

.about p {
    color: var(--muted);

}

.contact {
    background: var(--green);

}

.contact h2 {

}

.contact p {

/* Footer */

    background: #0d140f;
    text-align: center;
    padding: 25px;
    color: var(--muted);
}

    nav {
        flex-direction: column;
    }

    nav ul {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero {
        min-height: 500px;
    }

    section {
        padding: 55px 6%;
    }
